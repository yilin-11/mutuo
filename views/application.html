<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile · Mutuo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- In head and not deferred: the stored theme must be on <html> before the
       body paints. See public/js/theme.js. -->
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/stylesheets/base.css">
  <link rel="stylesheet" href="/stylesheets/application.css">
</head>

<body>
  <header class="nav">
    <a class="nav-brand" href="/members">Mutuo</a>
    <button class="nav-toggle" type="button" data-toggle="collapse" data-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="nav-collapse" id="mainNav">
      <ul class="nav-menu">
        <li><a class="nav-link" href="/members">Browse</a></li>
        <li>
          <a class="nav-link" href="/matches">Matches<span class="nav-badge" data-match-badge hidden></span></a>
        </li>
        <li><a class="nav-link" href="/application" aria-current="page">My profile</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
          <svg class="theme-icon theme-icon--sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1v1.7M8 13.3V15M15 8h-1.7M2.7 8H1M12.95 3.05l-1.2 1.2M4.25 11.75l-1.2 1.2M12.95 12.95l-1.2-1.2M4.25 4.25l-1.2-1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon theme-icon--moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.6 9.8A5.9 5.9 0 016.2 2.4 5.9 5.9 0 1013.6 9.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <a class="btn btn--ghost" href="/logout">Log out</a>
      </div>
    </div>
  </header>

  <main class="page page--narrow">
    <div class="page-header">
      <p class="eyebrow eyebrow--accent">Your listing</p>
      <h1 id="form-title" class="page-title">Create your profile</h1>
      <p class="page-lede">
        Tell other members what you can teach and what you'd like to learn.
      </p>
    </div>

    <!-- Filled in by application.js when the server rejects the submission. -->
    <div id="form-alert" class="alert" role="alert" style="display: none"></div>

    <form id="profile-form" novalidate>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" class="input" placeholder="Ada" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="field-label" for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" class="input" placeholder="Okonkwo" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="city">City</label>
          <input type="text" id="city" name="city" class="input" placeholder="Where are you based?" autocomplete="address-level2" required>
        </div>
        <div class="field">
          <label class="field-label" for="zipCode">Postal code</label>
          <input type="text" id="zipCode" name="zipCode" class="input" placeholder="Used to place you on the map" autocomplete="postal-code" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="teachSkill">Which skill can you share?</label>
          <!-- Both lists are populated from the shared list in common.js. -->
          <select id="teachSkill" name="teachSkill" class="input" required></select>
        </div>
        <div class="field">
          <label class="field-label" for="learnSkill">Which skill do you want to learn?</label>
          <select id="learnSkill" name="learnSkill" class="input" required></select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="bio">About you</label>
        <textarea id="bio" name="bio" class="input" rows="5" placeholder="Tell other members a little about yourself" maxlength="2000" required></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit" class="btn btn--primary">Save profile</button>
        <a href="/members" class="btn btn--ghost">Cancel</a>
      </div>
    </form>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="/js/common.js"></script>
  <script src="/js/application.js"></script>
</body>

</html>
