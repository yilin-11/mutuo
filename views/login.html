<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Mutuo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- In head and not deferred: the stored theme must be on <html> before the
       body paints. See public/js/theme.js. -->
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/stylesheets/base.css">
  <link href="/stylesheets/login.css" rel="stylesheet">
</head>

<body class="auth-page">
  <button class="theme-toggle theme-toggle--floating" type="button" data-theme-toggle aria-label="Switch theme">
    <svg class="theme-icon theme-icon--sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="3.25" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 1v1.7M8 13.3V15M15 8h-1.7M2.7 8H1M12.95 3.05l-1.2 1.2M4.25 11.75l-1.2 1.2M12.95 12.95l-1.2-1.2M4.25 4.25l-1.2-1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg class="theme-icon theme-icon--moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M13.6 9.8A5.9 5.9 0 016.2 2.4 5.9 5.9 0 1013.6 9.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>
  <main class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand nav-brand" href="/">Mutuo</a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-lede">Log in to browse the directory.</p>

      <form class="login" novalidate>
        <div class="field">
          <label class="field-label" for="email-input">Email address</label>
          <input type="email" class="input" id="email-input" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label class="field-label" for="password-input">Password</label>
          <input type="password" class="input" id="password-input" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <!-- Filled in by login.js when the server rejects the credentials. -->
        <div id="form-alert" class="alert" role="alert" style="display: none"></div>

        <button type="submit" class="btn btn--primary btn--block">Log in</button>
      </form>

      <!-- Filled in and revealed by login.js, but only on a demo deployment:
           the server answers /api/demo with null anywhere else. Empty here so
           the credentials live in one place, config/demo.js. -->
      <div id="demo-hint" class="demo-hint" style="display: none">
        <p class="demo-hint-lead">Just looking around?</p>
        <p class="demo-hint-body">
          This is a demo, seeded with twelve members who can teach each other
          something. Sign in with:
        </p>
        <dl class="demo-creds">
          <dt>email</dt>
          <dd><code id="demo-email"></code></dd>
          <dt>password</dt>
          <dd><code id="demo-password"></code></dd>
        </dl>
        <button type="button" id="demo-fill" class="btn btn--secondary btn--block">
          Fill this in for me
        </button>
      </div>

      <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>

</html>
