<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random match · Mutuo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/stylesheets/base.css">
  <!-- The member card itself is defined once, in members.css. -->
  <link rel="stylesheet" href="/stylesheets/members.css">
  <link rel="stylesheet" href="/stylesheets/game.css">
</head>

<body>
  <header class="nav">
    <a class="nav-brand" href="/members">Mutuo</a>
    <button class="nav-toggle" type="button" data-toggle="collapse" data-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="nav-collapse" id="mainNav">
      <ul class="nav-menu">
        <li><a class="nav-link" href="/members">Members</a></li>
        <li><a class="nav-link" href="/application">My profile</a></li>
        <li><a class="nav-link" href="/game" aria-current="page">Random match</a></li>
      </ul>
      <div class="nav-actions">
        <a class="btn btn--ghost" href="/logout">Log out</a>
      </div>
    </div>
  </header>

  <main class="page page--narrow match">
    <h1 class="match-heading">Not sure who to ask?</h1>
    <p class="match-lede">Let Mutuo pick a member for you.</p>

    <form id="match-form">
      <button id="randomBtn" class="btn btn--primary btn--lg" type="submit">Match me with someone</button>
    </form>

    <p id="match-status" class="match-status" role="status" aria-live="polite"></p>

    <div id="member_cards" class="match-result"></div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="/js/common.js"></script>
  <script src="/js/game.js"></script>
</body>

</html>
